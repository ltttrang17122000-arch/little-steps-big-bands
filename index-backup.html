function go(p){page=p;idx=0;unlocked=false;render()}function level(v){state.level=v;save();render()}function complete(ok,detail){logStudy(page,ok,detail);state.done++;if(!ok)state.errors.push(detail);save()}function speak(t){if(!('speechSynthesis'in window)){alert('Speech playback is unavailable in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=Number($('speed')?.value||1);speechSynthesis.speak(u)}function next(){idx++;unlocked=false;render()}function render(){ $('nav').innerHTML=['Home','Vocabulary','Reading','Listening','Writing','Speaking','Progress','Assessment'].map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let l=levels.indexOf(state.level), head=`<label>Practice level <select onchange="level(this.value)">${levels.map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select></label>`,h='';if(page==='Home'){h=`<section><small>READING TARGET</small><h2>Band 9.0 ✨</h2><p>Understand first. Practise second.</p><label>Today's energy <select id="energy" onchange="$('mission').textContent=['3 words + 1 short question','5 words + reading + listening','Reading + listening + writing + speaking'][this.selectedIndex]"><option>Lazy day · 5–10 min</option><option>Normal day · 30 min</option><option>Power day · 60–90 min</option></select></label><p id="mission">3 words + 1 short question</p><button onclick="go('Vocabulary')">Start learning →</button></section><div class="grid">${['Reading','Listening','Writing','Speaking','Vocabulary','Progress'].map(p=>`<button onclick="go('${p}')"><h3>${p}</h3>${p==='Reading'?'Road to band 9':p==='Vocabulary'?'English through English':'Small steps every day'}</button>`).join('')}</div>`}else if(page==='Vocabulary'){let w=words.filter(w=>w[1]===state.level)[0];if(idx)w=words[(words.indexOf(w)+idx)%words.length];h=head+`<section><small>${w[1]} · ${w[2]}</small><h2>${w[0]} <button onclick="speak('${w[0]}')">🔊</button></h2><label>Definition difficulty <select onchange="def=Number(this.value);render()">${['A1–A2','B1–B2','C1–C2'].map((x,i)=>`<option value="${i}" ${i===def?'selected':''}>${x}</option>`).join('')}</select></label><h3>${w[3+def]}</h3><p>${w[6]}</p><p>Collocation: ${w[7]}</p><button onclick="state.known.push('${w[0]}');complete(true,'');next()">I've got it</button> <button onclick="complete(false,'Vocabulary: ${w[0]}');next()">Review later</button></section>`}else if(page==='Reading'){let r=reading[l];h=head+`<section><h2>Reading · Road to band 9</h2><p class="muted">Read the question, locate evidence, then check meaning.</p><p class="lookup-text">${r[0]}</p><h3>${r[1]}</h3>${r[2].map((x,i)=>`<label><input type="radio" name="answer" value="${i}"> ${x}</label>`).join('')}<button onclick="checkReading()">Check answer</button><p id="feedback"></p></section>`}else if(page==='Listening'){let r=listen[l];h=head+`<section><h2>Active listening</h2><p>Predict the answer type before listening.</p><label>Speed <select id="speed"><option value="1">Normal</option><option value="0.75">Slow</option></select></label><button onclick="speak(listen[${l}][0])">▶ Play audio</button> <button onclick="speechSynthesis.cancel()">Stop</button><h3>${r[1]}</h3><input id="answer" placeholder="Your answer"><button onclick="checkListening()">Check</button><p id="feedback"></p><details><summary>Transcript & shadowing (after answering)</summary><p class="lookup-text">${r[0]}</p><button onclick="speak(listen[${l}][0])">Listen and repeat</button></details><p>Next: replay, write what you hear, compare with transcript, then shadow.</p></section>`}else if(page==='Writing'){let w=writing[idx%writing.length];h=`<section><h2>Writing Studio</h2><small>Question ${idx%writing.length+1} · IELTS Academic style</small><p class="lookup-text">${w[0]}</p>${w[1]===5?'<svg viewBox="0 0 300 150"><path d="M25 5V125H290" fill="none" stroke="#333"/><g fill="#77946a"><rect x="45" y="85" width="22" height="40"/><rect x="125" y="65" width="22" height="60"/><rect x="205" y="95" width="22" height="30"/></g><g fill="#d9a86d"><rect x="69" y="55" width="22" height="70"/><rect x="149" y="35" width="22" height="90"/><rect x="229" y="65" width="22" height="60"/></g><g font-size="10"><text x="45" y="140">City A</text><text x="125" y="140">City B</text><text x="205" y="140">City C</text><text x="30" y="12">% (1px = 0.5%)</text></g></svg><p>Green: 2010 · Gold: 2020</p>':''}<h3>1. Identify the task</h3>${types.map((x,i)=>`<label><input type="radio" name="type" value="${i}" ${unlocked&&i===w[1]?'checked':''}> ${x}</label>`).join('')}<button onclick="checkWriting()">Unlock writing</button><p id="feedback"></p>${unlocked?`<h3>2. Plan your response</h3><textarea id="plan" placeholder="Topic, position, key ideas..." oninput="draft('plan',this.value)">${esc(state.drafts['plan'+idx]||'')}</textarea><h3>3. Write</h3><textarea id="essay" oninput="draft('essay',this.value);count()" placeholder="Write here...">${esc(state.drafts['essay'+idx]||'')}</textarea><p id="count"></p><h3>4. Self-review</h3>${['I answered every part of the task.','My ideas are organised and supported.','I checked vocabulary and grammar.'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}<button onclick="complete(true,'');next()">Save & next prompt</button>`:'<p>🔒 Planning and writing are locked.</p>'}<button onclick="next()">Skip to another prompt</button></section>`}else if(page==='Speaking'){let s=speaking[idx%speaking.length];h=head+`<section><small>${s[0]}</small><h2 class="lookup-text">${s[1]}</h2>${idx%7<3?scene(idx%7):''}<p>${l<2?'Use short sentences: who, what, where.':l<4?'Give reasons and examples.':'Develop nuanced ideas, compare perspectives and justify your position.'}</p><button onclick="timer(60)">1 min preparation</button> <button onclick="timer(120)">2 min speaking</button><h3 id="clock">00:00</h3><button onclick="record()">Record voice</button> <button onclick="stopRecord()">Stop recording</button><p i function scene(i){return `<svg viewBox="0 0 320 170" role="img" aria-label="Illustrated speaking prompt"><rect width="320" height="170" rx="15" fill="#e7efdf"/><circle cx="270" cy="30" r="18" fill="#efce83"/><path d="M0 130Q80 90 160 130T320 130V170H0" fill="#a9c69b"/>${(i===1?[75,235]:[90,155,220]).map((x,j)=>`<circle cx="${x}" cy="65" r="13" fill="#c58f72"/><path d="M${x} 80v35m-18-20 18-10 18 10m-18 20-12 25m12-25 12 25" stroke="${['#647d9b','#b77b83','#7a956b'][j]}" stroke-width="8" stroke-linecap="round"/>`).join('')}<rect x="110" y="118" width="90" height="12" rx="3" fill="#c69e72"/><text x="12" y="20" font-size="11" fill="#405844">${['A day in the park','Study together or alone','A journey'][i]}</text></svg>`}function checkReading(){let a=document.querySelector('[name=answer]:checked');if(!a)return;let r=reading[levels.indexOf(state.level)],ok=+a.value===r[3];complete(ok,'Reading: '+r[1]);$('feedback').textContent=(ok?'Correct! ':'Review: ')+r[4]}function checkListening(){let r=listen[levels.indexOf(state.level)],ok=$('answer').value.trim().toLowerCase()===r[2].toLowerCase();complete(ok,'Listening: '+r[1]);$('feedback').textContent=(ok?'Correct! ':'Answer: '+r[2])}function checkWriting(){let a=document.querySelector('[name=type]:checked');if(!a)return;let ok=+a.value===writing[idx%writing.length][1];complete(ok,'Writing recognition: '+writing[idx%writing.length][0]);if(ok){unlocked=true;render();$('feedback').textContent='Correct! Planning unlocked.'}else $('feedback').textContent='Try again. Look at the final instruction.'}function draft(k,v){state.drafts[k+idx]=v;save()}function count(){$('count').textContent=($('essay').value.trim().match(/\S+/g)||[]).length+' words'}let tick;function timer(s){clearInterval(tick);const show=()=>{if(!$('clock')){clearInterval(tick);return}$('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s--<=0)clearInterval(tick)};show();tick=setInterval(show,1000)}let recorder,stream;async function record(){if(recorder?.state==='recording')return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);let chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{clearInterval(tick);if($('playback'))$('playback').src=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));stream.getTracks().forEach(t=>t.stop());if($('recstatus'))$('recstatus').textContent='Recording ready for playback (not saved).'};recorder.start();clearInterval(tick);const started=performance.now();const elapsed=()=>{let c=$('clock');if(c){let t=Math.floor((performance.now()-started)/1000);c.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}};elapsed();tick=setInterval(elapsed,200);$('recstatus').textContent='● Recording…'}catch(e){$('recstatus').textContent='Microphone unavailable. Check browser permissions.'}}function stopRecord(){if(recorder?.state==='recording'){clearInterval(tick);recorder.stop()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='ielts-backup.json';a.click()}async function restore(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.errors)||!Array.isArray(x.known)||typeof x.drafts!=='object'||!levels.includes(x.level))throw Error();state=x;save();render()}catch{alert('Invalid backup')}}
function bank(){return state.wordBank||(state.wordBank={})}
function enhanceDictionary(){document.querySelectorAll('.lookup-text').forEach(el=>{let t=el.textContent;el.innerHTML=esc(t).replace(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g,w=>`<span class="lookup-word">${w}</span>`);el.title='Click a word to look it up, or select text to save it.';el.addEventListener('click',e=>{if(window.getSelection().toString().trim())return;if(e.target.classList.contains('lookup-word'))lookup(e.target.textContent,t,false)});el.addEventListener('mouseup',()=>{let sel=window.getSelection(),v=sel.toString().trim();if(v&&el.contains(sel.anchorNode)&&el.contains(sel.focusNode))lookup(v,t,true)})});if(page==='Vocabulary'){let el=document.createElement('section');el.innerHTML='<h2>My unknown words</h2><p>Words saved from your lessons. Select a word to review it.</p>'+Object.keys(bank()).map((w,i)=>`<p><button data-bank="${i}">${esc(w)}</button> <small>${esc(bank()[w].definition||'Definition pending')}</small></p>`).join('');$('app').append(el);el.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{let w=Object.keys(bank())[+b.dataset.bank];lookup(w,bank()[w].context,false)})}}
let lookupToken=0;async function lookup(raw,context,auto){let w=raw.trim().toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,'');if(!w||w.length>100)return;let token=++lookupToken;let entry=bank()[w]||{context,definition:''};if(auto){bank()[w]=entry;save()}let panel=$('dictionaryPanel');panel.hidden=false;panel.innerHTML=`<button id="dictClose" style="float:right">✕</button><small>ENGLISH–ENGLISH DICTIONARY</small><h2>${esc(w)}</h2><button id="dictSpeak">🔊 Listen</button> <button id="dictSave">${auto||bank()[w]?'✓ Saved':'Save unknown word'}</button><div id="dictResult">Looking up definition…</div><p><small>Original context</small>${esc(context)}</p><label>My simple English definition<textarea id="dictNote" style="min-height:65px">${esc(entry.simple||'')}</textarea></label><button id="dictNoteSave">Save definition & word</button>`;$('dictClose').onclick=()=>{panel.hidden=true;lookupToken++};$('dictSpeak').onclick=()=>speak(w);function store(){bank()[w]=entry;save();$('dictSave').textContent='✓ Saved'}$('dictSave').onclick=store;$('dictNoteSave').onclick=()=>{entry.simple=$('dictNote').value;store()};let local=words.find(x=>x[0]===w);if(local){entry.definition=local[4];entry.simple=entry.simple||local[3];entry.advanced=local[5];entry.pos=local[2]}else if(!entry.definition){try{let res=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(!res.ok)throw Error();let data=await res.json(),d=data[0];entry.definition=d.meanings[0].definitions[0].definition;entry.pos=d.meanings[0].partOfSpeech;entry.ipa=d.phonetic||'';entry.extra=d.meanings.flatMap(m=>m.definitions.slice(0,2).map(x=>m.partOfSpeech+': '+x.definition)).slice(0,6)}catch{}}if(bank()[w]){bank()[w]=entry;save()}if(token!==lookupToken)return;$('dictNote').value=entry.simple||'';$('dictResult').innerHTML=entry.definition?`<p class="muted">${esc(entry.pos||'')} ${esc(entry.ipa||'')}</p>${entry.simple?'<h3>Easy definition</h3><p>'+esc(entry.simple)+'</p>':''}<h3>Dictionary definition</h3><p>${esc(entry.definition)}</p>${entry.advanced?'<p>'+esc(entry.advanced)+'</p>':''}${entry.extra?'<details><summary>Other meanings</summary>'+entry.extra.map(x=>'<p>'+esc(x)+'</p>').join('')+'</details>':''}`:'<p>No definition found. Internet may be unavailable, or this may be a phrase. You can save your own English definition below.</p>'}

re speaking.','Reflect on a difficult learning experience.']];

function pick(skill,max){let ids=Array.from({length:max},(_,i)=>i),a=attempts();let pool=ids.filter(i=>mode==='new'?!a[keyFor(skill,i)]:mode==='review'?a[keyFor(skill,i)]:mode==='mistakes'?a[keyFor(skill,i)]?.ok===false:true);if(!pool.length)pool=ids;return pool[Math.floor(Math.random()*pool.length)]}

function listenItem(n,l){let place=topics[n%10],day=days[(n+l)%7],time=9+(n%4),fee=5+n+l,room=12+n;let base=`Welcome to the ${place}. Our next session is on ${day} at ${time} in the morning. The fee is ${fee} pounds. Please meet in room ${room}.`;if(l>=2)base+=` Although we originally planned an afternoon session, the morning is more convenient for most visitors.`;if(l>=4)base+=` Participants should register in advance, as capacity is limited and walk-in places cannot be guaranteed.`;let q=[['Which day is the session?',day],['What time does it start?',String(time)],['How much is the fee in pounds?',String(fee)],['Which room should visitors go to?',String(room)]];return {base,q}}

function speakingPrompt(n,l){let t=topics[n%10],kind=Math.floor(n/10);return [['Personal questions',`What do you like about a ${t}? How often do you visit one?`],['Picture description',`Describe the scene. Imagine it takes place near a ${t}.`],['Role-play',`You are visiting a ${t}. Ask a staff member for information and explain what you need.`],['Discussion',`Should local governments invest more in facilities such as a ${t}? Explain your view.`],['IELTS cue card',`Describe a memorable visit to a ${t}. Say when, where, who was with you and why it mattered.`]][kind]}

function supportBox(){let a=lessons[genre];return support==='Independent'?'':`<section><h3>${genres[genre]} toolkit</h3><p>${a[0]}</p>${support==='Guided'?`<p><b>Before:</b> ${a[1]}</p><p><b>Improved:</b> ${a[2]}</p><p>Notice the specific details and logical connections.</p>`:''}<label><input type="checkbox"> I applied the technique.</label><label><input type="checkbox"> I checked clarity and grammar.</label></section>`}

const V5topics=[["Education", "Retrieval practice", "Recalling information without looking at notes can strengthen later recall. Feedback helps learners identify gaps.", "What helps learners identify gaps?", "Feedback", "Re-reading alone", "Longer breaks"], ["Psychology", "Working memory", "Working memory holds information temporarily while people carry out a task. Its capacity is limited, so complex instructions can be difficult to follow.", "Why can complex instructions be difficult?", "Limited capacity", "Unlimited storage", "Lack of vision"], ["Environment", "Urban trees", "Trees provide shade and release water through their leaves. Both processes can help cool streets, although results depend on local conditions.", "Which process besides shade helps cool streets?", "Water release", "Road construction", "Artificial lighting"], ["Technology", "Data privacy", "Collecting only necessary information reduces the amount of personal data exposed if a system is compromised. This approach is called data minimisation.", "What does data minimisation reduce?", "Unnecessary personal data", "Internet speed", "Screen size"], ["Economics", "Opportunity cost", "Choosing one option often means giving up another. Opportunity cost is the value of the best alternative forgone, not necessarily the money spent.", "What is opportunity cost?", "Value of the best alternative forgone", "Total money spent", "All possible alternatives combined"], ["Business", "Customer retention", "A company may improve retention by resolving complaints promptly and consistently. Retention measures whether customers continue using its services.", "What does retention measure?", "Continued use of services", "Number of employees", "Office size"], ["Science", "Experimental controls", "A control group provides a comparison for an experimental group. Without a suitable comparison, researchers may struggle to attribute changes to an intervention.", "Why use a control group?", "To provide a comparison", "To guarantee success", "To remove all uncertainty"], ["Health", "Sleep routines", "Regular sleep schedules can support the body's daily rhythms. Bright light late in the evening may interfere with the timing of sleep.", "What may interfere with sleep timing?", "Bright evening light", "Regular schedules", "Morning routines"], ["History", "Primary sources", "Letters written during an event are primary sources. They can reveal contemporary perspectives but may also reflect the writer's biases.", "What limitation can letters have?", "Writer bias", "No contemporary perspective", "Guaranteed accuracy"], ["Geography", "River flooding", "Flood risk depends on rainfall, land use and drainage. Paved surfaces can increase runoff because less water enters the soil.", "Why can paving increase runoff?", "Less water enters soil", "Rainfall stops", "Rivers disappear"], ["Linguistics", "Language variation", "Speakers adjust their language according to context and audience. Variation is not necessarily evidence of poor language ability.", "What can influence language choice?", "Context and audience", "Only spelling", "Only age"], ["Sociology", "Social networks", "Social networks can provide practical support and information. However, access to useful connections is not distributed equally.", "What is unequally distributed?", "Access to useful connections", "All information equally", "The definition of support"], ["Architecture", "Passive cooling", "Building orientation and ventilation can reduce the need for mechanical cooling. Their effectiveness depends on climate and design.", "What influences effectiveness?", "Climate and design", "Building name", "Furniture colour alone"], ["Finance", "Diversification", "Holding different investments can reduce exposure to the failure of a single asset. It does not eliminate every form of financial risk.", "What does diversification not eliminate?", "Every financial risk", "All investment choices", "The need for assets"], ["Research", "Sampling bias", "A const V5bank=[];function v5add(program,skill,topic,title,body,q,answer,choices=[],kind='Original micro-practice',audio=''){V5bank.push({id:'V5-'+String(V5bank.length+1).padStart(4,'0'),program,skill,topic,title,body,q,answer,choices,kind,audio})}

let v5filter={program:'All',skill:'All',topic:'All',status:'All',query:''},v5id=null;function v5records(){return state.v5records||(state.v5records={})}function v5pool(){return V5bank.filter(x=>Object.entries(v5filter).every(([k,v])=>v==='All'||v===''||(k==='query'?Object.values(x).join(' ').toLowerCase().includes(v.toLowerCase()):k==='status'?(v==='New'?!v5records()[x.id]:v==='Review'?v5records()[x.id]?.ok===false:!!v5records()[x.id]):x[k]===v)))}function v5change(k,v){v5filter[k]=v;v5id=null;render()}function v5move(d){let a=v5pool();if(!a.length)return;let i=a.findIndex(x=>x.id===v5id);v5id=a[(i+d+a.length)%a.length].id;render()}function v5pick(daily=false){let a=v5pool();if(!a.length)return;let fresh=a.filter(x=>!v5records()[x.id]);if(!daily&&fresh.length)a=fresh;let n=daily?Math.floor(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())/86400000):Math.floor(Math.random()*a.length);v5id=a[n%a.length].id;render()}
function v5check(){let x=V5bank.find(x=>x.id===v5id),v=$('v5answer').value.trim();if(!v)return;let ok=x.answer===null?null:x.skill==='Math'?Number.isFinite(Number(v))&&Math.abs(Number(v)-Number(x.answer))<0.00001:v.toLowerCase()===x.answer.toLowerCase();v5records()[x.id]={ok,answer:v,date:new Date().toISOString()};if(ok===false)state.errors.push(x.id+': '+v+' → '+x.answer);logStudy(x.skill,ok!==false,x.id+(ok===null?' (unscored)':''));save();$('v5feedback').textContent=ok===null?'Saved for self-review; not automatically scored.':(ok?'Correct. ':'Try again. ')+'Answer: '+x.answer;}
function v5select(k,values){return `<label>${k} <select onchange="v5change('${k}',this.value)">${['All',...values].map(v=>`<option ${v5filter[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function v5library(){let a=v5pool(),x=a.find(x=>x.id===v5id)||a[0];v5id=x?.id||null;let count=Object.keys(v5records()).length;return `<section><small>V5 · INTERNATIONAL LEARNING ACADEMY</small><h2>Practice library</h2><p>${V5bank.length} local activities · ${count} attempted · original short tasks and generated variants, not full exam papers.</p><div class="grid">${['program','skill','topic'].map(k=>v5select(k,[...new Set(V5bank.map(x=>x[k]))])).join('')}${v5select('status',['New','Attempted','Review'])}</div><label>Search <input value="${esc(v5filter.query)}" onchange="v5change('query',this.value)"></label><button onclick="v5pick(true)">Daily practice</button> <button onclick="v5pick()">Shuffle / prefer unseen</button><p>${a.length} matching activities</p>${x?`<label>Choose activity <select onchange="v5id=this.value;render()">${a.map(y=>`<option value="${y.id}" ${y.id===x.id?'selected':''}>${y.id} · ${esc(y.title)}</option>`).join('')}</select></label><button onclick="v5move(-1)">← Previous</button> ${a.indexOf(x)+1}/${a.length} <button onclick="v5move(1)">Next →</button>`:'<p>No matching activities. Change filters.</p>'}</section>${x?`<section><small>${x.id} · ${x.kind} · ${x.program} · ${x.skill}</small><h2>${esc(x.title)}</h2><p class="lookup-text">${esc(x.body)}</p>${x.audio?`<button onclick="speak(V5bank.find(x=>x.id===v5id).audio)">▶ Play synthetic audio</button><details><summary>Transcript</summary><p class="lookup-text">${esc(x.audio)}</p></details>`:''}<h3>${esc(x.q)}</h3>${x.choices.length?`<select id="v5answer"><option value="">Choose an answer</option>${[...x.choices].sort((a,b)=>a.localeCompare(b)).map(c=>`<option>${esc(c)}</option>`).join('')}</select>`:`<textarea id="v5answer" placeholder="Your answer">${esc(v5records()[x.id]?.answer||'')}</textarea>`}<button onclick="v5check()">${x.answer===null?'Save response':'Check answer'}</button><p id="v5feedback"></p>${x.answer!==null?`<details><summary>Answer key</summary><p>${esc(x.answer)}</p></details>`:'<p class="muted">Self-review: check relevance, organisation, accuracy and clarity. No AI scoring.</p>'}</section>`:''}`}
function v5sources(){return `<section><h2>International resource library</h2><p>External learning resources; their contents are not copied into this site. Availability and access terms may change.</p>${V5resources.map(([n,u])=>`<p><a href="${u}" target="_blank" rel="noopener noreferrer">${n} ↗</a></p>`).join('')}</section>`}
const v5old=render;render=function(){v5old();for(const n of ['Practice Library','International Resources']){let b=document.createElement('button');b.textContent=n;b.onclick=()=>go(n);$('nav').prepend(b)}if(page==='Practice Library')$('app').innerHTML=v5library();if(page==='International Resources')$('app').innerHTML=v5sources();if(page==='Home')$('app').insertAdjacentHTML('afterbegin',`<section><h2>International Learning Academy · V5</h2><p>${V5bank.length} new activities. Explore the expanded practice library.</p><button onclick="go('Practice Library')">Open practice library →</button></section>`);if(page==='Practice Library')enhanceDictionary()};render();

const V6lessons=[["Reading", "Matching Headings", "Read headings first; underline distinguishing concepts rather than repeated topic words. Predict paraphrases. Read the whole paragraph, marking contrast and concession. Summarise its controlling idea in your own words, then eliminate headings that cover only examples or introductory details.", "Urban gardens provide fresh food. However, high rents and operating costs threaten their survival. Headings: i Benefits of gardens; ii Financial barriers; iii Historical origins. Choose ii: high rents and operating costs paraphrase financial barriers; the first sentence is background.", "However signals contrast, not an automatic answer. A repeated keyword may be a distractor.", "Electric buses reduce street noise. Yet battery replacement and charging infrastructure remain expensive, limiting adoption. Choose: i Environmental benefits; ii Costs limiting adoption; iii History of buses.", "ii. The final clause explains the central constraint; noise is only an introductory benefit."], ["Reading", "Matching Information", "Underline the specific information requested, predict paraphrases, scan for distinctive names or concepts, then verify the entire sentence and surrounding context. Check whether letters may be reused.", "A describes a trial in 2018; B explains why the trial failed. A question asking for a reason for failure belongs to B, not A.", "Do not confuse a paragraph's main topic with the location of a detail.", "A: The museum opened in 1990. B: Attendance fell because transport was unreliable. Which paragraph gives a cause of declining attendance?", "B: because transport was unreliable."], ["Reading", "Matching Features", "Identify the entities in the options. Scan for each name and track pronouns and reporting verbs. Match the claim, not merely the nearest name.", "Lee rejected the proposal, whereas Chen supported it. A claim of approval matches Chen.", "A quoted opposing view may not be the named person's own view.", "Ali predicted lower costs; Kim warned of higher costs. Who anticipated savings?", "Ali; lower costs means savings."], ["Reading", "Matching Sentence Endings", "Read stems first and predict meaning and grammatical form. Locate the relevant passage and test each ending for both meaning and grammar.", "The trial was postponed because equipment had not arrived. Stem: The trial was delayed because ... Ending: necessary equipment was missing.", "A grammatical fit alone does not establish factual agreement.", "The library extended its hours to accommodate evening workers. Complete: The change was intended to ...", "meet the needs of evening workers."], ["Reading", "True / False / Not Given", "Break the statement into subject, claim, qualifiers and time. Locate evidence. True means supported, False means contradicted, Not Given means neither can be established. Compare quantifiers carefully.", "Text: Some participants cycled. Statement: All participants cycled. Not Given: some does not establish whether all did. If text says only some, then False.", "Do not use outside knowledge or assume absence means contradiction.", "Text: The course lasts six weeks. Statement: The course lasts eight weeks.", "False; six contradicts eight."], ["Reading", "Yes / No / Not Given", "Identify the writer's claim or opinion. Locate evaluative language and attribution. Compare the statement with the writer's position, not a quoted person's opinion.", "The author calls the policy ineffective. Statement: The author believes the policy works well. No.", "A reported view is not necessarily endorsed by the author.", "The writer argues that remote work benefits some employees. Statement: The writer believes remote work benefits every employee.", "Not Given unless the text explicitly excludes others; some alone does not settle every."], ["Reading", "Multiple Choice", "Read the stem and distinguish options by scope, cause, time or attitude. Locate evidence, predict an answer before comparing options, eliminate each unsupported option.", "The study measured sleep, not productivity. Asked what was measured, choose sleep even if productivity is mentioned as a future goal.", "An option can be true in the passage but irrelevant to the question.", "A survey measured travel time; its authors hope to study emissions later. What did it measure: travel time or emissions?", "Travel time; emissions are a future goal."], ["Reading", "Sentence Completion", "Read the word limit. Predict part of speech and meaning, locate the paraphrased sentence, copy the required words exactly and reread for grammar.", "Text: The device uses solar energy. Stem: The device is powered by __. NO MORE THAN TWO WORDS: solar energy.", "Do not add articles that exceed the word limit.", "Text: The building is cooled by natural ventilation. Complete: Cooling relies on __. Two words maximum.", "natural ventilation."], ["Reading", "Summary Completion", "Read the summary as a whole, identify its topic and grammatical gaps, locate the corresponding passage section and match meaning. Follow whether words come from text or a list.", "Text: Costs rose after fuel prices increased. Summary: Higher __ caused rising costs. Answer: fuel prices.", "Do not assume every gap is in passage order.", "Text: The trial ended early because funding ran out. Summary: A lack of __ shortened the trial. One word.", "funding."], ["Reading", "Note Completion", "Use headings and bullet hierarchy to locate the relevant section. Predict the missing category and obey word limits.", "Notes: Location: __. Text: The workshop takes place in the main hall. Answer: main hall.", "Notes need not form full sentences.", "Text: Participants must bring a passport. Notes: Required document: __. One word.", "passport."], ["Reading", "Table Completion", "Read row and column labels before the text. Identify the unit or category, locate the correct row entity, and verify the cell against the passage.", "A costs $20 and B costs $30. Row B, price column: $30.", "Do not copy a value from an adjacent row.", "Text: The north site opened in 2012; the south site in 2015. South site, opening year: __.", "2015."], ["Reading", "Flow-chart Completion", "Follow arrows to understand sequence or causality. Predict action or material at each gap, locate process language and check the stage order.", "Seeds are washed, dried, then packed. The middle stage is drying.", "Do not mistake a condition for a process stage.", "Water is filtered, heated, then stored. What happens immediately before storage?", "It is heated."], ["Reading", "Diagram Label Completion", "Inspect the diagram and orientation. Identify the part indicated by each arrow. Locate spatial descriptions and copy the exact label within the word limit.", "Text: A filter sits beneath the inlet. An arrow to the part below the inlet labels the filter.", "Do not confuse relative positions or the arrow endpoint.", "Text: A valve is above the tank; a pump is below it. Label the component below the tank.", "pump."], ["Reading", "Short-answer Questions", "Identify the question word and required information type. Locate the evidence, copy only the necessary words and check the limit.", "Where was the trial held? Text: It was held in a rural clinic. Three words maximum: a rural clinic.", "Do not answer with a full sentence if it exceeds the limit.", "Text: The project began in April. When did it begin? One word.", "April."], ["Writing", "Opinion Essay", "Identify the exact proposition and degree of agreement. Choose a defensible position. Plan two distinct reasons; develop each with claim, mechanism, example and link. State the position consistently in introduction and conclusion.", "Prompt: Universities should be free. Position: largely agree. Reason: lower financial barriers widen access; explain how fees deter low-income applicants, then qualify with funding constraints.", "Do not merely list advantages or switch position halfway. Avoid invented statistics.", "Plan an essay on ria such as cost, access or quality. Give a reasoned judgement if requested.", "Remote work saves commuting time but can reduce informal collaboration. Weigh these effects by job type.", "Do not count arguments as if all have equal importance.", "Do the advantages of online education outweigh the disadvantages?", "Check both sides and explicit comparative judgement."], ["Writing", "Two-part Questions", "Underline both questions and their scope. Allocate sufficient development to each. Use a thesis that signals both answers and organise paragraphs accordingly.", "Why do people move to cities? Is this positive? Explain employment access, then evaluate consequences separately.", "Do not answer only the more familiar question.", "Why do people change careers? Is this a positive development?", "Check both questions are answered and evaluation is justified."], ["Writing", "Line Graph", "Read axes, units, period and legend. Identify overall trends and exceptions, group similar series, then select accurate figures and comparisons. Write an overview without speculation.", "A rises from 20 to 50; B falls from 60 to 40. Overview: A increased while B declined, with A ending higher.", "Do not invent causes or list every data point.", "A: 10, 20, 40; B: 50, 45, 30 in 2000, 2010, 2020. Write an overview and comparison.", "Check opposite trends, crossover by final year, correct figures and units if supplied."], ["Writing", "Bar Chart", "Identify categories, units and whether time changes. Group highest, lowest and notable gaps. Compare like with like.", "A=40%, B=20%, C=40%. A and C jointly lead, each twice B.", "Do not describe static categories as increasing over time.", "A=60, B=30, C=45. Write two comparisons.", "A is twice B; C lies between them. Avoid unsupported units."], ["Writing", "Pie Chart", "Identify whole, categories and dates. Compare proportions, largest shares and changes if multiple charts. Distinguish percentage points from percent change.", "A rises from 20% to function v6lesson(){let a=v6list(),x=a[v6idx]||a[0],k=x[0]+':'+x[1];return `<section><small>V6 · STUDY CENTRE · Original strategy lessons</small><h2>Learn before you practise</h2><p>Choose a skill and a lesson. Strategies are recommendations, not universal rules.</p><div>${['Reading','Writing','Listening','Speaking'].map(t=>`<button class="${t===v6skill?'active':''}" onclick="v6skill='${t}';v6idx=0;render()">${t}</button>`).join(' ')}</div><label>Lesson <select onchange="v6idx=Number(this.value);render()">${a.map((y,i)=>`<option value="${i}" ${i===v6idx?'selected':''}>${state.v6learned[y[0]+':'+y[1]]?'✓ ':''}${esc(y[1])}</option>`).join('')}</select></label><button onclick="v6idx=Math.max(0,v6idx-1);render()">← Previous</button> <button onclick="v6idx=Math.min(v6list().length-1,v6idx+1);render()">Next →</button></section><section><h2>${esc(x[1])}</h2><h3>Method & reasoning</h3><p>${esc(x[2])}</p><h3>Worked example</h3><p>${esc(x[3])}</p><h3 class="bad">Common traps</h3><p>${esc(x[4])}</p><button onclick="state.v6learned[${esc(JSON.stringify(k))}]=true;save();render()">Mark lesson studied</button></section><section><h3>My method notebook</h3><textarea id="v6method" oninput="state.v6methods[${esc(JSON.stringify(k))}]=this.value;save()">${esc(state.v6methods[k]||x[2])}</textarea><p>Saved locally on this browser. Personal methods are not official exam rules.</p></section><section><h3>Independent mini practice</h3><p>${esc(x[5])}</p>${x[0]==='Listening'?'<button onclick="v6audio()">Play synthetic practice</button>':''}<textarea id="v6response" placeholder="Your response and reasoning"></textarea><details><summary>Reveal feedback / self-review</summary><p>${esc(x[6])}</p></details><button onclick="v6export()">Prepare AI feedback prompt</button><textarea id="v6export" readonly placeholder="Copy the generated prompt to your AI tutor"></textarea><button onclick="go('Practice Library')">Open general practice library</button><p class="muted">Mini exercises are not full exam tasks. The general library is separate and not mapped to every lesson.</p></section><section><h3>Further reading</h3><a href="https://ielts.org/" target="_blank" rel="noopener">IELTS official guidance</a> · <a href="https://learnenglish.britishcouncil.org/" target="_blank" rel="noopener">British Council</a> · <a href="https://writingcenter.fas.harvard.edu/" target="_blank" rel="noopener">Harvard Writing Center</a><p>External reference links; lessons are original, not official endorsed materials.</p></section>`}
