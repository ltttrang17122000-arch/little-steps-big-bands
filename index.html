function go(p){page=p;idx=0;unlocked=false;render()}function level(v){state.level=v;save();render()}function complete(ok,detail){logStudy(page,ok,detail);state.done++;if(!ok)state.errors.push(detail);save()}function speak(t){if(!('speechSynthesis'in window)){alert('Speech playback is unavailable in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=Number($('speed')?.value||1);speechSynthesis.speak(u)}function next(){idx++;unlocked=false;render()}function render(){ $('nav').innerHTML=['Home','Vocabulary','Reading','Listening','Writing','Speaking','Progress','Assessment'].map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let l=levels.indexOf(state.level), head=`<label>Practice level <select onchange="level(this.value)">${levels.map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select></label>`,h='';if(page==='Home'){h=`<section><small>READING TARGET</small><h2>Band 9.0 ✨</h2><p>Understand first. Practise second.</p><label>Today's energy <select id="energy" onchange="$('mission').textContent=['3 words + 1 short question','5 words + reading + listening','Reading + listening + writing + speaking'][this.selectedIndex]"><option>Lazy day · 5–10 min</option><option>Normal day · 30 min</option><option>Power day · 60–90 min</option></select></label><p id="mission">3 words + 1 short question</p><button onclick="go('Vocabulary')">Start learning →</button></section><div class="grid">${['Reading','Listening','Writing','Speaking','Vocabulary','Progress'].map(p=>`<button onclick="go('${p}')"><h3>${p}</h3>${p==='Reading'?'Road to band 9':p==='Vocabulary'?'English through English':'Small steps every day'}</button>`).join('')}</div>`}else if(page==='Vocabulary'){let w=words.filter(w=>w[1]===state.level)[0];if(idx)w=words[(words.indexOf(w)+idx)%words.length];h=head+`<section><small>${w[1]} · ${w[2]}</small><h2>${w[0]} <button onclick="speak('${w[0]}')">🔊</button></h2><label>Definition difficulty <select onchange="def=Number(this.value);render()">${['A1–A2','B1–B2','C1–C2'].map((x,i)=>`<option value="${i}" ${i===def?'selected':''}>${x}</option>`).join('')}</select></label><h3>${w[3+def]}</h3><p>${w[6]}</p><p>Collocation: ${w[7]}</p><button onclick="state.known.push('${w[0]}');complete(true,'');next()">I've got it</button> <button onclick="complete(false,'Vocabulary: ${w[0]}');next()">Review later</button></section>`}else if(page==='Reading'){let r=reading[l];h=head+`<section><h2>Reading · Road to band 9</h2><p class="muted">Read the question, locate evidence, then check meaning.</p><p class="lookup-text">${r[0]}</p><h3>${r[1]}</h3>${r[2].map((x,i)=>`<label><input type="radio" name="answer" value="${i}"> ${x}</label>`).join('')}<button onclick="checkReading()">Check answer</button><p id="feedback"></p></section>`}else if(page==='Listening'){let r=listen[l];h=head+`<section><h2>Active listening</h2><p>Predict the answer type before listening.</p><label>Speed <select id="speed"><option value="1">Normal</option><option value="0.75">Slow</option></select></label><button onclick="speak(listen[${l}][0])">▶ Play audio</button> <button onclick="speechSynthesis.cancel()">Stop</button><h3>${r[1]}</h3><input id="answer" placeholder="Your answer"><button onclick="checkListening()">Check</button><p id="feedback"></p><details><summary>Transcript & shadowing (after answering)</summary><p class="lookup-text">${r[0]}</p><button onclick="speak(listen[${l}][0])">Listen and repeat</button></details><p>Next: replay, write what you hear, compare with transcript, then shadow.</p></section>`}else if(page==='Writing'){let w=writing[idx%writing.length];h=`<section><h2>Writing Studio</h2><small>Question ${idx%writing.length+1} · IELTS Academic style</small><p class="lookup-text">${w[0]}</p>${w[1]===5?'<svg viewBox="0 0 300 150"><path d="M25 5V125H290" fill="none" stroke="#333"/><g fill="#77946a"><rect x="45" y="85" width="22" height="40"/><rect x="125" y="65" width="22" height="60"/><rect x="205" y="95" width="22" height="30"/></g><g fill="#d9a86d"><rect x="69" y="55" width="22" height="70"/><rect x="149" y="35" width="22" height="90"/><rect x="229" y="65" width="22" height="60"/></g><g font-size="10"><text x="45" y="140">City A</text><text x="125" y="140">City B</text><text x="205" y="140">City C</text><text x="30" y="12">% (1px = 0.5%)</text></g></svg><p>Green: 2010 · Gold: 2020</p>':''}<h3>1. Identify the task</h3>${types.map((x,i)=>`<label><input type="radio" name="type" value="${i}" ${unlocked&&i===w[1]?'checked':''}> ${x}</label>`).join('')}<button onclick="checkWriting()">Unlock writing</button><p id="feedback"></p>${unlocked?`<h3>2. Plan your response</h3><textarea id="plan" placeholder="Topic, position, key ideas..." oninput="draft('plan',this.value)">${esc(state.drafts['plan'+idx]||'')}</textarea><h3>3. Write</h3><textarea id="essay" oninput="draft('essay',this.value);count()" placeholder="Write here...">${esc(state.drafts['essay'+idx]||'')}</textarea><p id="count"></p><h3>4. Self-review</h3>${['I answered every part of the task.','My ideas are organised and supported.','I checked vocabulary and grammar.'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}<button onclick="complete(true,'');next()">Save & next prompt</button>`:'<p>🔒 Planning and writing are locked.</p>'}<button onclick="next()">Skip to another prompt</button></section>`}else if(page==='Speaking'){let s=speaking[idx%speaking.length];h=head+`<section><small>${s[0]}</small><h2 class="lookup-text">${s[1]}</h2>${idx%7<3?scene(idx%7):''}<p>${l<2?'Use short sentences: who, what, where.':l<4?'Give reasons and examples.':'Develop nuanced ideas, compare perspectives and justify your position.'}</p><button onclick="timer(60)">1 min preparation</button> <button onclick="timer(120)">2 min speaking</button><h3 id="clock">00:00</h3><button onclick="record()">Record voice</button> <button onclick="stopRecord()">Stop recording</button><p i function scene(i){return `<svg viewBox="0 0 320 170" role="img" aria-label="Illustrated speaking prompt"><rect width="320" height="170" rx="15" fill="#e7efdf"/><circle cx="270" cy="30" r="18" fill="#efce83"/><path d="M0 130Q80 90 160 130T320 130V170H0" fill="#a9c69b"/>${(i===1?[75,235]:[90,155,220]).map((x,j)=>`<circle cx="${x}" cy="65" r="13" fill="#c58f72"/><path d="M${x} 80v35m-18-20 18-10 18 10m-18 20-12 25m12-25 12 25" stroke="${['#647d9b','#b77b83','#7a956b'][j]}" stroke-width="8" stroke-linecap="round"/>`).join('')}<rect x="110" y="118" width="90" height="12" rx="3" fill="#c69e72"/><text x="12" y="20" font-size="11" fill="#405844">${['A day in the park','Study together or alone','A journey'][i]}</text></svg>`}function checkReading(){let a=document.querySelector('[name=answer]:checked');if(!a)return;let r=reading[levels.indexOf(state.level)],ok=+a.value===r[3];complete(ok,'Reading: '+r[1]);$('feedback').textContent=(ok?'Correct! ':'Review: ')+r[4]}function checkListening(){let r=listen[levels.indexOf(state.level)],ok=$('answer').value.trim().toLowerCase()===r[2].toLowerCase();complete(ok,'Listening: '+r[1]);$('feedback').textContent=(ok?'Correct! ':'Answer: '+r[2])}function checkWriting(){let a=document.querySelector('[name=type]:checked');if(!a)return;let ok=+a.value===writing[idx%writing.length][1];complete(ok,'Writing recognition: '+writing[idx%writing.length][0]);if(ok){unlocked=true;render();$('feedback').textContent='Correct! Planning unlocked.'}else $('feedback').textContent='Try again. Look at the final instruction.'}function draft(k,v){state.drafts[k+idx]=v;save()}function count(){$('count').textContent=($('essay').value.trim().match(/\S+/g)||[]).length+' words'}let tick;function timer(s){clearInterval(tick);const show=()=>{if(!$('clock')){clearInterval(tick);return}$('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s--<=0)clearInterval(tick)};show();tick=setInterval(show,1000)}let recorder,stream;async function record(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);let chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{if($('playback'))$('playback').src=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));stream.getTracks().forEach(t=>t.stop());if($('recstatus'))$('recstatus').textContent='Recording ready for playback (not saved).'};recorder.start();$('recstatus').textContent='Recording…'}catch(e){$('recstatus').textContent='Microphone unavailable. Check browser permissions.'}}function stopRecord(){if(recorder?.state==='recording')recorder.stop()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='ielts-backup.json';a.click()}async function restore(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.errors)||!Array.isArray(x.known)||typeof x.drafts!=='object'||!levels.includes(x.level))throw Error();state=x;save();render()}catch{alert('Invalid backup')}}
function bank(){return state.wordBank||(state.wordBank={})}
function enhanceDictionary(){document.querySelectorAll('.lookup-text').forEach(el=>{let t=el.textContent;el.innerHTML=esc(t).replace(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g,w=>`<span class="lookup-word">${w}</span>`);el.title='Click a word to look it up, or select text to save it.';el.addEventListener('click',e=>{if(window.getSelection().toString().trim())return;if(e.target.classList.contains('lookup-word'))lookup(e.target.textContent,t,false)});el.addEventListener('mouseup',()=>{let sel=window.getSelection(),v=sel.toString().trim();if(v&&el.contains(sel.anchorNode)&&el.contains(sel.focusNode))lookup(v,t,true)})});if(page==='Vocabulary'){let el=document.createElement('section');el.innerHTML='<h2>My unknown words</h2><p>Words saved from your lessons. Select a word to review it.</p>'+Object.keys(bank()).map((w,i)=>`<p><button data-bank="${i}">${esc(w)}</button> <small>${esc(bank()[w].definition||'Definition pending')}</small></p>`).join('');$('app').append(el);el.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{let w=Object.keys(bank())[+b.dataset.bank];lookup(w,bank()[w].context,false)})}}
let lookupToken=0;async function lookup(raw,context,auto){let w=raw.trim().toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,'');if(!w||w.length>100)return;let token=++lookupToken;let entry=bank()[w]||{context,definition:''};if(auto){bank()[w]=entry;save()}let panel=$('dictionaryPanel');panel.hidden=false;panel.innerHTML=`<button id="dictClose" style="float:right">✕</button><small>ENGLISH–ENGLISH DICTIONARY</small><h2>${esc(w)}</h2><button id="dictSpeak">🔊 Listen</button> <button id="dictSave">${auto||bank()[w]?'✓ Saved':'Save unknown word'}</button><div id="dictResult">Looking up definition…</div><p><small>Original context</small>${esc(context)}</p><label>My simple English definition<textarea id="dictNote" style="min-height:65px">${esc(entry.simple||'')}</textarea></label><button id="dictNoteSave">Save definition & word</button>`;$('dictClose').onclick=()=>{panel.hidden=true;lookupToken++};$('dictSpeak').onclick=()=>speak(w);function store(){bank()[w]=entry;save();$('dictSave').textContent='✓ Saved'}$('dictSave').onclick=store;$('dictNoteSave').onclick=()=>{entry.simple=$('dictNote').value;store()};let local=words.find(x=>x[0]===w);if(local){entry.definition=local[4];entry.simple=entry.simple||local[3];entry.advanced=local[5];entry.pos=local[2]}else if(!entry.definition){try{let res=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(!res.ok)throw Error();let data=await res.json(),d=data[0];entry.definition=d.meanings[0].definitions[0].definition;entry.pos=d.meanings[0].partOfSpeech;entry.ipa=d.phonetic||'';entry.extra=d.meanings.flatMap(m=>m.definitions.slice(0,2).map(x=>m.partOfSpeech+': '+x.definition)).slice(0,6)}catch{}}if(bank()[w]){bank()[w]=entry;save()}if(token!==lookupToken)return;$('dictNote').value=entry.simple||'';$('dictResult').innerHTML=entry.definition?`<p class="muted">${esc(entry.pos||'')} ${esc(entry.ipa||'')}</p>${entry.simple?'<h3>Easy definition</h3><p>'+esc(entry.simple)+'</p>':''}<h3>Dictionary definition</h3><p>${esc(entry.definition)}</p>${entry.advanced?'<p>'+esc(entry.advanced)+'</p>':''}${entry.extra?'<details><summary>Other meanings</summary>'+entry.extra.map(x=>'<p>'+esc(x)+'</p>').join('')+'</details>':''}`:'<p>No definition found. Internet may be unavailable, or this may be a phrase. You can save your own English definition below.</p>'}

re speaking.','Reflect on a difficult learning experience.']];

function pick(skill,max){let ids=Array.from({length:max},(_,i)=>i),a=attempts();let pool=ids.filter(i=>mode==='new'?!a[keyFor(skill,i)]:mode==='review'?a[keyFor(skill,i)]:mode==='mistakes'?a[keyFor(skill,i)]?.ok===false:true);if(!pool.length)pool=ids;return pool[Math.floor(Math.random()*pool.length)]}
function controls(skill,max){return `<label>Level <select onchange="level(this.value)">${levels.map(x=>`<option ${x===state.level?'selected':''}>${x}</option>`).join('')}</select></label><label>Practice mode <select onchange="mode=this.value;current=null;render()">${['new','random','review','mistakes'].map(x=>`<option ${x===mode?'selected':''}>${x}</option>`).join('')}</select></label><button onclick="current=null;render()">Another practice</button> <small>${max} practice variants at this level · generated from built-in templates</small>`}
function listenItem(n,l){let place=topics[n%10],day=days[(n+l)%7],time=9+(n%4),fee=5+n+l,room=12+n;let base=`Welcome to the ${place}. Our next session is on ${day} at ${time} in the morning. The fee is ${fee} pounds. Please meet in room ${room}.`;if(l>=2)base+=` Although we originally planned an afternoon session, the morning is more convenient for most visitors.`;if(l>=4)base+=` Participants should register in advance, as capacity is limited and walk-in places cannot be guaranteed.`;let q=[['Which day is the session?',day],['What time does it start?',String(time)],['How much is the fee in pounds?',String(fee)],['Which room should visitors go to?',String(room)]];return {base,q}}
function finishL(){let item=listenItem(current,levels.indexOf(state.level)),score=0;item.q.forEach((q,i)=>{let ok=$('la'+i).value.trim().toLowerCase()===q[1].toLowerCase();score+=ok;logStudy('Listening',ok,q[0]);$('lf'+i).textContent=(ok?'Correct: ':'Answer: ')+q[1]});attempts()[keyFor('Listening',current)]={ok:score===4};state.done++;save();$('lt').hidden=false;$('ls').textContent=score+'/4';$('lc').disabled=true}
function speakingPrompt(n,l){let t=topics[n%10],kind=Math.floor(n/10);return [['Personal questions',`What do you like about a ${t}? How often do you visit one?`],['Picture description',`Describe the scene. Imagine it takes place near a ${t}.`],['Role-play',`You are visiting a ${t}. Ask a staff member for information and explain what you need.`],['Discussion',`Should local governments invest more in facilities such as a ${t}? Explain your view.`],['IELTS cue card',`Describe a memorable visit to a ${t}. Say when, where, who was with you and why it mattered.`]][kind]}
function finishS(){attempts()[keyFor('Speaking',current)]={ok:null};complete(true,'Speaking practice completed (not scored)');current=null;render()}
function supportBox(){let a=lessons[genre];return support==='Independent'?'':`<section><h3>${genres[genre]} toolkit</h3><p>${a[0]}</p>${support==='Guided'?`<p><b>Before:</b> ${a[1]}</p><p><b>Improved:</b> ${a[2]}</p><p>Notice the specific details and logical connections.</p>`:''}<label><input type="checkbox"> I applied the technique.</label><label><input type="checkbox"> I checked clarity and grammar.</label></section>`}
function academy(){return `<section><h2>Writing Academy</h2><label>Genre <select onchange="genre=+this.value;render()">${genres.map((x,i)=>`<option value="${i}" ${genre===i?'selected':''}>${x}</option>`).join('')}</select></label><label>Support <select onchange="support=this.value;render()">${['Guided','Supported','Independent'].map(x=>`<option ${x===support?'selected':''}>${x}</option>`).join('')}</select></label><p class="lookup-text">${lessons[genre][3]}</p>${supportBox()}<textarea placeholder="Practise here" oninput="state.drafts['academy'+genre]=this.value;save()">${esc(state.drafts['academy'+genre]||'')}</textarea><button onclick="complete(true,'Writing academy practice');alert('Saved')">Save practice</button></section>`}
function assessment(){let dates=new Set(history().map(x=>x.date)).size;return `<section><h2>Assessment Centre</h2><p>${dates} active learning days · ${history().length} logged activities</p><p>Recommended: ${dates>=30?'Extended diagnostic':dates>=14?'Four-skill progress check':dates>=7?'Weekly progress check':'Baseline check'}</p><button onclick="startMock(false)">Start short four-skill check</button> <button onclick="startMock(true)">Start extended four-skill simulation</button><p class="muted">Extended simulation uses 30/60/60/14 minute limits, but has fewer questions than official IELTS. Writing and Speaking require self-review.</p></section><section><h3>Assessment history</h3>${(state.tests||[]).map(t=>`<p>${esc(t.date)} · Listening ${t.l}/4 · Reading ${t.r}/6 · Writing/Speaking unscored</p>`).join('')||'No assessments yet.'}</section>`}
function startMock(full){mock={full,part:0,l:0,r:0,played:false,answers:{}};mockPart()}
function mockPart(){clearInterval(mt);let p=mock.part,mins=(mock.full?[30,60,60,14]:[5,10,15,5])[p];let h=`<section><small>ASSESSMENT · ${p+1}/4</small><h2>${['Listening','Reading','Writing','Speaking'][p]}</h2><h3 id="mclock"></h3>`;if(p===0){let a=listenItem(19,4);h+=`<button id="mplay" onclick="this.disabled=true;speak(listenItem(19,4).base)">Play once</button>`+a.q.map((q,i)=>`<label>${q[0]} <input id="ma${i}"></label>`).join('')}if(p===1)h+=reading.map((r,i)=>`<p>${esc(r[0])}</p><b>${esc(r[1])}</b>${r[2].map((x,j)=>`<label><input type="radio" name="mr${i}" value="${j}"> ${esc(x)}</label>`).join('')}`).join('');if(p===2)h+=`<p>Task 1: Attendance at a library rose from 200 to 350 between 2010 and 2020; museum attendance fell from 400 to 300. Summarise and compare.</p><textarea id="mw1"></textarea><p>Task 2: Some people believe public transport should be free. To what extent do you agree?</p><textarea id="mw2"></textarea>`;if(p===3)h+=`<p>Part 1: Tell me about your hometown and daily routine.</p><p>Part 2: Describe a useful skill you learned.</p><p>Part 3: How should education adapt to changes in technology?</p><button onclick="record()">Record</button> <button onclick="stopRecord()">Stop</button><p id="recstatus"></p><audio id="playback" controls></audio><textarea id="ms" placeholder="Self-review notes"></textarea>`; $('app').innerHTML=h+`<button onclick="submitMock()">Submit section</button></section>`;let end=Date.now()+mins*60000;let update=()=>{let t=Math.max(0,Math.ceil((end-Date.now())/1000));if(!$('mclock')){clearInterval(mt);return}$('mclock').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(!t)submitMock()};update();mt=setInterval(update,1000)}
function submitMock(){clearInterval(mt);speechSynthesis.cancel();let p=mock.part;if(p===0)mock.l=listenItem(19,4).q.filter((q,i)=>$('ma'+i).value.trim().toLowerCase()===q[1].toLowerCase()).length;if(p===1)mock.r=reading.filter((r,i)=>Number(document.querySelector(`[name=mr${i}]:checked`)?.value)===r[3]).length;if(p===2)mock.w=[$('mw1').value,$('mw2').value];if(p===3){mock.s=$('ms').value;stopRecord();(state.tests||(state.tests=[])).push({...mock,date:new Date().toISOString().slice(0,10)});save();mock=null;render();return}mock.part++;mockPart()}
const oldGo=go;go=function(p){if(mock&&!confirm('Leave this assessment? Current test will be lost.'))return;mock=null;clearInterval(mt);current=null;oldGo(p)};const oldLevel=level;level=function(v){current=null;oldLevel(v)};
render=function(){oldRender();if(page==='Listening'){if(current===null)current=pick(page,30);let a=listenItem(current,levels.indexOf(state.level));$('app').innerHTML=controls(page,30)+`<section><h2>Listening practice ${current+1}</h2><p>Predict → listen → answer → check → shadow.</p><button onclick="speak(listenItem(current,levels.indexOf(state.level)).base)">Play audio</button>${a.q.map((q,i)=>`<label>${q[0]} <input id="la${i}"></label><p id="lf${i}"></p>`).join('')}<button id="lc" onclick="finishL()">Check answers</button><p id="ls"></p><div id="lt" hidden><p class="lookup-text">${a.base}</p><textarea placeholder="Dictation / shadowing notes"></textarea></div></section>`;enhanceDictionary()}if(page==='Speaking'){if(current===null)current=pick(page,50);let a=speakingPrompt(current,levels.indexOf(state.level));$('app').innerHTML=controls(page,50)+`<section><small>${a[0]}</small><h2 class="lookup-text">${a[1]}</h2>${a[0]==='Picture description'?scene(current%3):''}<p>${levels.indexOf(state.level)<2?'Use short sentences.':'Give reasons, examples and specific details.'}</p><button onclick="timer(60)">Prepare 1 min</button> <button onclick="timer(120)">Speak 2 min</button><h3 id="clock">00:00</h3><button onclick="record()">Record</button> <button onclick="stopRecord()">Stop</button><p id="recstatus"></p><audio id="playback" controls></audio><textarea placeholder="Notes" oninput="state.drafts[keyFor('Speaking',current)]=this.value;save()">${esc(state.drafts[keyFor('Speaking',current)]||'')}</textarea><button onclick="finishS()">Finish & next</button></section>`;enhanceDictionary()}if(page==='Writing'){let div=document.createElement('div');div.innerHTML=academy();$('app').prepend(div);div.querySelectorAll('.lookup-text').forEach(x=>x.classList.remove('lookup-text'))}if(page==='Assessment')$('app').innerHTML=assessment();if(page==='Home'){let d=document.createElement('section');d.innerHTML=`<h3>Your next checkpoint</h3><p>${new Set(history().map(x=>x.date)).size} active days logged. Review your assessment recommendation.</p><button onclick="go('Assessment')">Assessment Centre</button>`;$('app').prepend(d)}};


const v4render=render;
const official=[['IELTS Academic','https://ielts.org/take-a-test/test-types/ielts-academic-test'],['IELTS sample tests','https://ielts.org/take-a-test/preparation-resources/sample-test-questions/academic-test'],['Cambridge preparation','https://www.cambridgeenglish.org/learning-english/exam-preparation/'],['ETS TOEFL 2026','https://www.ets.org/toefl/test-takers/ibt/about/content.html?version=after-jan-2026'],['CEFR','https://www.coe.int/en/web/common-european-framework-reference-languages']];
const exams=['Pre-A1 Starters','A1 Movers','A2 Flyers','A2 Key','B1 Preliminary','B2 First','C1 Advanced','C2 Proficiency','IELTS Academic','TOEFL iBT 2026'];
const rtypes=['Multiple choice','True / False / Not Given','Yes / No / Not Given','Matching headings','Matching information','Matching features','Matching sentence endings','Sentence completion','Summary completion','Note completion','Table completion','Flow-chart completion','Diagram label completion','Short-answer questions'];
const passage='A. In 2022, a town converted an unused car park into a community garden. The council supplied tools, while volunteers planted vegetables. The project initially had 24 members.\n\nB. To reduce water consumption, the gardeners installed a rainwater tank. Water flows from the roof through a filter into the tank, then reaches the beds through a pipe. During the first summer, the garden used 30 percent less mains water than a comparable site.\n\nC. In my view, the greatest benefit is not the food produced but the social contact between neighbours. However, expansion should depend on local demand rather than a fixed national target.';
const rq=[['Who supplied tools?','The council','Volunteers','A university','A shop'],['The garden began with 24 members.','True','False','Not Given'],['The writer believes every town should have a fixed expansion target.','No','Yes','Not Given'],['Choose the best heading for B.','Saving water','Recruiting members','Selling vegetables'],['Which paragraph describes the initial membership?','A','B','C'],['Match the council to its contribution.','Tools','Vegetables','Roof'],['Water reaches the beds through …','a pipe','a roof','a volunteer'],['The project began with ___ members.','24'],['The tank helped reduce consumption of ___ water.','mains'],['Initial membership: ___ people.','24'],['Water saving compared with another site: ___ percent.','30'],['Roof → filter → ___ → pipe.','tank'],['Label the container between filter and pipe.','tank'],['What was the site previously used as?','car park']];
let rt=0, wt=0, lt=0; const wtypes=['Line graph','Bar chart','Pie chart','Table','Map','Process diagram','Mixed charts'];
function visual(n){let base='<svg viewBox="0 0 420 210" role="img" aria-label="Original practice diagram" xmlns="http://www.w3.org/2000/svg">';if(n===4)return base+`<g fill="#e5eddb" stroke="#526a58"><rect x="10" y="25" width="190" height="160"/><rect x="220" y="25" width="190" height="160"/></g><g font-size="12" fill="#263c32"><text x="65" y="17">2010</text><text x="280" y="17">2025</text><text x="25" y="60">Car park</text><text x="25" y="150">Library</text><text x="235" y="60">Garden</text><text x="235" y="150">Library</text><text x="320" y="100">Cafe</text></g><path d="M10 110H200 M220 110H410" stroke="#949b91" stroke-width="12"/></svg>`;if(n===5)return base+`<g fill="#e5eddb" stroke="#526a58"><rect x="10" y="70" width="85" height="55"/><rect x="115" y="70" width="85" height="55"/><rect x="220" y="70" width="85" height="55"/><rect x="325" y="70" width="85" height="55"/></g><g font-size="12"><text x="30" y="100">Roof</text><text x="135" y="100">Filter</text><text x="240" y="100">Tank</text><text x="345" y="100">Beds</text><text x="97" y="100">→</text><text x="202" y="100">→</text><text x="307" y="100">→</text></g></svg>`;if(n===3)return '<table><tr><th>Year</th><th>Bus</th><th>Rail</th></tr><tr><td>2010</td><td>20%</td><td>30%</td></tr><tr><td>2020</td><td>40%</td><td>50%</td></tr></table>';if(n===2)return base+'<circle cx="110" cy="100" r="75" fill="#84a786"/><path d="M110 100 L110 25 A75 75 0 0 1 110 175 Z" fill="#e6bb68"/><text x="220" y="80">Bus: 50%</text><text x="220" y="110">Rail: 50%</text></svg>';return base+`<path d="M45 15V170H400" fill="none" stroke="#53665b"/><g font-size="11"><text x="5" y="40">60%</text><text x="5" y="105">30%</text><text x="25" y="170">0</text><text x="90" y="193">2010</text><text x="300" y="193">2020</text></g>${n===0?'<path d="M110 120L320 70" stroke="#4c8965" stroke-width="4"/><path d="M110 95L320 45" stroke="#bc873b" stroke-width="4"/>':'<g fill="#4c8965"><rect x="90" y="120" width="32" height="50"/><rect x="290" y="70" width="32" height="100"/></g><g fill="#bc873b"><rect x="125" y="95" width="32" height="75"/><rect x="325" y="45" width="32" height="125"/></g>'}${n===6?'<path d="M110 95L320 45" stroke="#263c32" stroke-width="3" stroke-dasharray="5 4"/>':''}<text x="190" y="20" font-size="11">Bus (green) · Rail (gold)</text></svg>`}
function options(a,n){return a.map((x,i)=>`<option value="${i}" ${i===n?'selected':''}>${esc(x)}</option>`).join('')}
function reading4(){let q=rq[rt],choices=q.slice(1);return `<section><small>IELTS-STYLE MICRO PRACTICE · ORIGINAL · NOT A FULL TEST</small><h2>Reading question types</h2><select onchange="rt=+this.value;render()">${options(rtypes,rt)}</select><p class="tip">Read the instruction, predict the answer type, locate evidence, check meaning and spelling.</p><p class="lookup-text" style="white-space:pre-line">${passage}</p>${rt===12?visual(5).replace('>Tank<','> ? <'):rt===11?'<p>Roof → Filter → ____ → Pipe</p>':rt===10?'<table><tr><th>Measure</th><th>Result</th></tr><tr><td>Water saving (%)</td><td>____</td></tr></table>':''}<p>${esc(q[0])}</p>${choices.length>1?`<select id="r4a"><option value="">Choose</option>${[...choices].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:'<p>Use no more than two words and/or a number.</p><input id="r4a">'} <button onclick="check4('Reading',rq[rt][1], 'r4a','r4f')">Check</button><div id="r4f"></div></section>`}
function check4(skill,answer,id,out){let v=$(id).value.trim(),ok=v.toLowerCase()===answer.toLowerCase();complete(ok,skill+': '+v+' → '+answer);$(out).innerHTML=`<p class="${ok?'good':'bad'}">${ok?'Correct':'Review this answer'} · ${esc(answer)}</p><p class="important">NOTE: Compare the wording with the source, not outside knowledge.</p>`;}
function writing4(){return `<section><small>IELTS ACADEMIC TASK 1 · ORIGINAL VISUAL DRILLS</small><h2>Visual writing academy</h2><select onchange="wt=+this.value;render()">${options(wtypes,wt)}</select>${visual(wt)}<p>Summarise the main features and make comparisons where relevant.</p><label>Identify the visual type first <select id="wguess"><option value="">Choose</option>${options(wtypes,-1)}</select></label><button onclick="if($('wguess').value==String(wt)){$('wbody').hidden=false;$('wg').textContent='Correct'}else $('wg').textContent='Try again'">Unlock writing</button><p id="wg"></p><div id="wbody" hidden><p class="tip">${wt===4?'Compare locations and changes; use accurate spatial language.':wt===5?'Identify the first and final stages; use sequence language.':'Identify the main patterns, then group and compare figures.'}</p><p class="important">NOTE: Do not invent reasons or data.</p><label>Overview and plan<textarea oninput="state.drafts['visualplan'+wt]=this.value;save()">${esc(state.drafts['visualplan'+wt]||'')}</textarea></label><label>Response (150+ words; target 20 min)<textarea oninput="state.drafts['visual'+wt]=this.value;save();$('wc4').textContent=this.value.trim().split(/\\s+/).filter(Boolean).length">${esc(state.drafts['visual'+wt]||'')}</textarea></label><p>Word count: <span id="wc4">—</span></p><button onclick="timer(1200)">20 min</button><span id="clock">00:00</span><p>Self-review: task achievement · coherence · vocabulary · grammatical accuracy.</p></div></section>`}
function listening4(){let transcript='Enter the park from the south. The cafe is to your left, and the information desk is immediately to your right. Continue north to reach the lake.';return `<section><small>IELTS LISTENING · MAP LABELLING · SYNTHETIC AUDIO</small><h2>Map practice</h2><svg viewBox="0 0 320 200"><rect x="15" y="15" width="290" height="170" fill="#e5eddb"/><path d="M160 185V50" stroke="#aaa" stroke-width="20"/><ellipse cx="160" cy="40" rx="45" ry="20" fill="#9ccad7"/><rect x="30" y="110" width="65" height="40" fill="white"/><rect x="225" y="110" width="65" height="40" fill="white"/><text x="55" y="135">A</text><text x="250" y="135">B</text><text x="145" y="45">Lake</text><text x="130" y="198">Entrance</text></svg><p>Predict the direction words, then listen.</p><button onclick="speak('${transcript}')">Play</button><label>Which location is the cafe? <input id="l4a"></label><button onclick="check4('Listening','A','l4a','l4f');$('l4t').hidden=false">Check</button><div id="l4f"></div><p id="l4t" hidden class="lookup-text">${transcript}</p></section>`}
function notes4(){let notes=state.notes4||[];return `<section><h2>My colour notebook</h2><select id="nc"><option value="#b52d32">Important / mistake · red</option><option value="#26703c">Correct · green</option><option value="#265ba4">Grammar · blue</option><option value="#8051a6">Vocabulary · purple</option><option value="#946214">Strategy · gold</option></select><textarea id="nt" placeholder="Your note"></textarea><button onclick="if($('nt').value.trim()){(state.notes4||(state.notes4=[])).push({text:$('nt').value,color:$('nc').value});save();render()}">Save note</button>${notes.map((n,i)=>`<p style="color:${/^#[0-9a-f]{6}$/i.test(n.color)?n.color:'#333'}">${esc(n.text)} <button onclick="state.notes4.splice(${i},1);save();render()">Delete</button></p>`).join('')}<h3>Recorded mistakes</h3>${state.errors.map(x=>`<p class="important">${esc(x)}</p>`).join('')}</section>`}
function standards4(){return `<section><h2>Exam reference centre</h2><p>Choose a target. This saves your preference; the legacy general exercises are not automatically calibrated to that exam.</p><select onchange="state.exam=exams[+this.value];save()">${options(exams,Math.max(0,exams.indexOf(state.exam||'IELTS Academic')))}</select><h3>IELTS Academic</h3><p>Reading: 40 questions, 60 min. Listening: 40 questions, about 30 min. Writing: two tasks, 60 min. Speaking: three parts, 11–14 min.</p><h3>TOEFL iBT 2026</h3><p>Reading: word completion and daily-life/academic texts. Listening: responses, conversations, announcements and talks. Writing: sentence building, email and academic discussion. Speaking: repetition and interview. Adaptive official-test simulation is not implemented.</p><h3>Official resources</h3>${official.map(x=>`<p><a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a></p>`).join('')}<p>Cambridge and CEFR links are reference resources, not a validated curriculum. All local tasks are original practice.</p></section>`}
render=function(){v4render();const n=$('nav');for(const x of ['Exam reference','Notebook']){let b=document.createElement('button');b.textContent=x;b.onclick=()=>go(x);n.append(b)}if(page==='Exam reference')$('app').innerHTML=standards4();if(page==='Notebook')$('app').innerHTML=notes4();if(page==='Reading')$('app').insertAdjacentHTML('afterbegin',reading4());if(page==='Listening')$('app').insertAdjacentHTML('afterbegin',listening4());if(page==='Writing')$('app').insertAdjacentHTML('afterbegin',writing4());if(page==='Speaking')$('app').insertAdjacentHTML('afterbegin',`<section><h2>Visual speaking extension</h2>${visual(4)}<p>Compare the two plans. Explain what changed and give directions from the library to the cafe.</p>${visual(0)}<p>Summarise the data orally. These are general speaking drills, not IELTS Speaking question types.</p></section>`);if(page==='Assessment')$('app').insertAdjacentHTML('afterbegin',`<section><p class="important">These are short diagnostic simulations, not full official mocks. Use the official sample tests in Exam reference for complete practice.</p></section>`);let b=document.createElement('button');b.textContent='Print / Save PDF';b.onclick=()=>window.print();n.append(b);enhanceDictionary()};
